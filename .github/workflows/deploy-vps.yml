name: Deploy to VPS
on:
  workflow_dispatch:   # manual deploy to the VPS (no empty-commit needed)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} \
          "${{ vars.PROJECT_PATH }}/deploy/deploy.sh"

      - name: Smoke check
        run: |
          sleep 5
          curl -sS -o /dev/null -w "homepage: HTTP %{http_code}\n" \
            "https://dorjidokan.softcredible.com/" --fail
