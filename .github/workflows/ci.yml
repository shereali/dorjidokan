name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite
      - run: php artisan migrate:fresh --seed && php artisan test
      - run: vendor/bin/pint --test || vendor/bin/pint
      - run: composer audit --locked || true
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run verify
      - run: npm run histoire:build
      - run: npx --yes @redocly/cli@latest lint ../docs/openapi.yaml
      - run: npx --yes @redocly/cli@latest lint ../docs/application-openapi.yaml --skip-rule operation-summary --skip-rule operation-4xx-response --skip-rule info-license --skip-rule no-server-example.com --skip-rule security-defined
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate && touch database/database.sqlite
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
  load-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 inspect tests/load/api-smoke.js
