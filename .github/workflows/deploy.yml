name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Support both raw private key and base64-encoded key
          if echo "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            echo "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519

          # Validate key syntax
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || {
            echo "::error::SSH key is invalid or corrupted. Check secrets.VPS_SSH_KEY."
            exit 1
          }

          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "$SSH_PORT" | tr -d '[:space:]')
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Deploy Script
        env:
          SSH_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'dorjidokan' }}
          SSH_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
          APP_PATH: ${{ secrets.PROJECT_PATH || vars.PROJECT_PATH || '/var/www/dorjidokan' }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "$SSH_PORT" | tr -d '[:space:]')
          PATH_TARGET=$(echo "$APP_PATH" | tr -d '[:space:]')

          ssh -i ~/.ssh/id_ed25519 \
              -p "$PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              "$USER@$HOST" \
              "bash $PATH_TARGET/deploy/deploy.sh"

      - name: Health Check
        run: |
          echo "Waiting 5 seconds for services to initialize..."
          sleep 5
          curl -sS -o /dev/null -w "Homepage HTTP status: %{http_code}\n" "https://dorjidokan.softcredible.com/" || echo "Health check curl warning (DNS/SSL may still be propagating)"
