# Production deployment for dorjidokan (Nuxt 3 + Laravel 12 + MySQL 8).
# Joins the shared Caddy reverse proxy on this VPS via the external `caddy_net`.
# Requires the shared Caddy stack (e.g. at /opt/caddy) to already be running
# and to have created the `caddy_net` external network.
#
# Create /var/www/dorjidokan/.env from .env.example before `docker compose up`.
# No ports are ever mapped to the host — all traffic enters via Caddy.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Public, non-secret runtime values — ship in the browser bundle.
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
        NUXT_PUBLIC_REVERB_APP_KEY: ${NUXT_PUBLIC_REVERB_APP_KEY}
        NUXT_PUBLIC_REVERB_HOST: ${NUXT_PUBLIC_REVERB_HOST}
        NUXT_PUBLIC_REVERB_PORT: ${NUXT_PUBLIC_REVERB_PORT}
        NUXT_PUBLIC_REVERB_SCHEME: ${NUXT_PUBLIC_REVERB_SCHEME}
    container_name: dorjidokan-frontend-1
    restart: unless-stopped
    networks:
      - internal
      - caddy_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dorjidokan-backend-1
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-storage:/var/www/html/storage
    networks:
      - internal
      - caddy_net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    image: mysql:8
    container_name: dorjidokan-db-1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  db-data:
  backend-storage:

networks:
  internal:
    driver: bridge
  caddy_net:
    external: true
